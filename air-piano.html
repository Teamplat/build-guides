<title>Air Piano Build Guide</title>
<style>
:root{--bg:#e9edf2;--panel:rgba(255,255,255,.92);--ink:#16202b;--muted:#5b6876;--line:#d5dce4;--accent:#2f6fe4;--chip:#eef3fb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--panel:rgba(22,27,34,.92);--ink:#e8edf3;--muted:#9aa7b4;--line:#2c3540;--chip:#1f2a37}}
:root[data-theme="dark"]{--panel:rgba(22,27,34,.92);--ink:#e8edf3;--muted:#9aa7b4;--line:#2c3540;--chip:#1f2a37}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
#tags{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;padding:3px 8px;border-radius:999px;background:#16202bdd;color:#fff;font:600 12px/1.2 system-ui,sans-serif;white-space:nowrap;animation:pop .35s ease-out}
.tag.hole{background:#2f6fe4e6}
.tag.show{background:#f08a1ae6}
.bubble{position:absolute;left:0;top:0;padding:6px 12px;border-radius:12px;background:#fff;color:#16202b;font:700 16px system-ui,sans-serif;box-shadow:0 6px 20px #0003;opacity:0;transition:opacity .2s}
.bubble.on{opacity:1}
@keyframes pop{from{opacity:0;margin-top:8px}to{opacity:1;margin-top:0}}
header{position:fixed;left:max(16px,env(safe-area-inset-left,0px));top:calc(14px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:10px;pointer-events:none}
header h1{margin:0;font-size:18px;font-weight:750;letter-spacing:-.01em;background:var(--panel);padding:7px 12px;border-radius:10px;border:1px solid var(--line);pointer-events:auto}
header .hint{font-size:12px;color:var(--muted);background:var(--panel);padding:5px 9px;border-radius:8px;border:1px solid var(--line)}
#panel{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(760px,calc(100% - 32px));background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:16px;padding:14px 16px 12px;box-shadow:0 10px 30px #0002}
#stepNum{font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
#stepTitle{margin:2px 0 4px;font-size:19px;font-weight:750}
#stepText{color:var(--ink);font-size:14.5px;min-height:42px}
#stepText b{font-weight:700}
#stepText code{background:var(--chip);padding:1px 5px;border-radius:5px;font:600 13px ui-monospace,monospace}
.row{display:flex;align-items:center;gap:8px;margin-top:10px}
.row button{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:10px;height:34px;min-width:40px;font-size:15px;cursor:pointer}
.row button:hover{border-color:var(--accent)}
.clean #panel,.clean header{display:none}
#inset{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(14px + env(safe-area-inset-top,0px));background:#05080c;border:1px solid var(--line);border-radius:12px;padding:8px 10px 10px;box-shadow:0 10px 30px #0003}
#inset span{display:block;color:#9fb3c8;font:600 11px system-ui,sans-serif;letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px}
#inset canvas{display:block;width:min(256px,40vw);aspect-ratio:2/1;height:auto;image-rendering:pixelated}
.clean #inset{display:none}
.back{pointer-events:auto;text-decoration:none;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 11px;font-weight:650;font-size:14px}
.back:hover{border-color:var(--accent)}
button:focus-visible,.back:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#dots{display:flex;gap:4px;flex:1;flex-wrap:wrap}
#dots button{min-width:0;width:14px;height:8px;padding:0;border-radius:4px;background:var(--line);border:none}
#dots button.on{background:var(--accent);width:22px}
#track{height:3px;background:var(--line);border-radius:3px;margin-top:10px;overflow:hidden}
#bar{height:100%;background:var(--accent);width:0;transition:width .4s}
@media (max-width:600px){header .hint{display:none}#stepTitle{font-size:17px}#stepText{font-size:14px}#panel{bottom:8px;padding:12px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>

</div>
<script>window.SPEC = {"title": "Air Piano: how to build it", "board": {"type": "830"}, "parts": [{"id": "board", "type": "breadboard"}, {"id": "esp", "type": "esp32_38", "tag": "ESP32"}, {"id": "sensor", "type": "hcsr04", "mount": "board", "pos": [24.13, 14.47, 0], "tag": "HC-SR04"}, {"id": "r1", "type": "resistor", "ohms": 1000, "a": "41g", "b": "37g"}, {"id": "r2", "type": "resistor", "ohms": 1000, "a": "37i", "b": "33i"}, {"id": "r3", "type": "resistor", "ohms": 1000, "a": "33h", "b": "29h"}, {"id": "buzzer", "type": "buzzer", "kind": "passive", "plus": "58j", "minus": "55j", "tag": "Passive buzzer"}, {"id": "usb", "type": "usb", "to": [-330, -60, -8.5], "via": [[-160, -30, -6]]}, {"id": "keys", "type": "keys", "pos": [24.13, 278, -8.5], "rot": 90}, {"id": "hand", "type": "hand", "pos": [24.13, 253, -6]}], "wires": [["2j", "red rail @3", "red", {}], ["7j", "blue rail @7", "black", {}], ["43i", "red rail @27", "red", {}], ["40i", "blue rail @29", "black", {}], ["42f", "11j", "yellow", {}], ["29g", "blue rail @31", "black", {}], ["37f", "10j", "green", {}], ["58h", "12j", "orange", {}], ["55h", "blue rail @25", "black", {}]], "steps": [{"all": true, "title": "What you're building", "text": "Move your hand above the cardboard keys. The <b>distance sensor</b> measures how far away your hand is and the <b>buzzer</b> plays a note: closer = lower, further = higher. 8 notes, 5 cm each.", "hold": 9, "dist": 620, "el": 30}, {"title": "The breadboard", "show": ["board"], "dist": 300, "text": "Lay the big breadboard flat, <b>row 1 on the left</b>. In each row, holes <b>a-e</b> are connected, and holes <b>f-j</b> are connected. The long lines at the top are the <b>+ (red)</b> and <b>\u2212 (blue)</b> rails."}, {"title": "ESP32", "show": ["esp"], "dist": 210, "text": "Push the ESP32 in with its pins in <b>column a</b> and <b>column i</b>, <b>rows 2-20</b>. The USB-C port points left. Check: <code>V5</code> is in <code>2i</code> and <code>3V3</code> in <code>20i</code>. Column j stays free next to the pins we use."}, {"title": "Power to the rails", "show": ["w0", "w1"], "focus": ["esp", "w0", "w1"], "dist": 190, "text": "<b>Red wire</b> <code>2j</code> (V5) \u2192 red + rail, row 3. <b>Black wire</b> <code>7j</code> (GND) \u2192 blue \u2212 rail, row 7. Now the rails carry 5V and GND."}, {"title": "Distance sensor", "show": ["sensor"], "focus": ["sensor"], "dist": 170, "az": -20, "text": "Stand the HC-SR04 in <b>column j</b>: GND <code>40j</code>, ECHO <code>41j</code>, TRIG <code>42j</code>, VCC <code>43j</code>. Its two 'eyes' look out over the edge of the board."}, {"title": "Sensor power", "show": ["w2", "w3"], "focus": ["sensor", "w2", "w3"], "dist": 200, "text": "<b>Red</b> <code>43i</code> \u2192 red rail row 27 (VCC gets 5V). <b>Black</b> <code>40i</code> \u2192 blue rail row 29 (GND)."}, {"title": "TRIG wire", "show": ["w4"], "focus": ["w4"], "dist": 230, "text": "<b>Yellow</b> <code>42f</code> \u2192 <code>11j</code>. That's ESP32 pin <b>26</b>: it tells the sensor to send a ping."}, {"title": "Voltage divider (3 \u00d7 1k\u03a9)", "show": ["r1", "r2", "r3"], "focus": ["r1", "r2", "r3"], "dist": 140, "az": -10, "el": 55, "text": "ECHO sends back 5V, but ESP32 pins only take 3.3V. Three 1k\u03a9 resistors in a row bring it down: <code>41g</code>\u2192<code>37g</code>, <code>37i</code>\u2192<code>33i</code>, <code>33h</code>\u2192<code>29h</code>. 1k\u03a9 = brown, black, black, brown."}, {"title": "Divider wires", "show": ["w5", "w6"], "focus": ["r1", "r3", "w5", "w6"], "dist": 230, "text": "<b>Black</b> <code>29g</code> \u2192 blue rail row 31 (bottom of the divider to GND). <b>Green</b> <code>37f</code> \u2192 <code>10j</code>, ESP32 pin <b>27</b>: it reads the safe 3.3V echo."}, {"title": "Buzzer", "show": ["buzzer"], "focus": ["buzzer"], "dist": 120, "az": -25, "text": "Use the <b>passive</b> buzzer (green circuit board underneath, no sticker). <b>+</b> leg (the longer one) in <code>58j</code>, other leg in <code>55j</code>."}, {"title": "Buzzer wires", "show": ["w7", "w8"], "focus": ["buzzer", "w7", "w8"], "dist": 260, "text": "<b>Orange</b> <code>58h</code> \u2192 <code>12j</code>, ESP32 pin <b>25</b> (plays the notes). <b>Black</b> <code>55h</code> \u2192 blue rail row 25 (GND). All rail wires stay in rows 1-31."}, {"title": "USB and code", "show": ["usb"], "focus": ["esp", "usb"], "dist": 260, "text": "Plug a USB-C cable into the ESP32 and the laptop. Open <code>firmware/</code> in PlatformIO and press <b>Upload</b>. The laptop also powers everything."}, {"title": "Cardboard keys", "show": ["keys"], "focus": ["keys", "sensor"], "dist": 560, "el": 45, "text": "Lay a cardboard strip in front of the sensor and mark 8 keys, <b>5 cm each</b>, starting 5 cm from the sensor: C D E F G A B C."}, {"title": "Play it!", "show": ["hand"], "demo": true, "focus": ["keys", "board"], "dist": 600, "el": 32, "text": "Hold your flat hand above a key, palm facing the sensor. Move it closer and further to play. Press \ud83d\udd07 to hear it."}], "demo": "airpiano"};</script>
<script type="module">
// Build animation engine: makes every part in real sizes (mm) with three.js
// and plays a project's build steps from SPEC (injected above this file).
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";

const S = window.SPEC;
const PITCH = 2.54;
const COL_Y = { a: -13.97, b: -11.43, c: -8.89, d: -6.35, e: -3.81, f: 3.81, g: 6.35, h: 8.89, i: 11.43, j: 13.97 };
const RAIL_Y = { blue: 19.05, red: 21.59 };
const BOARD = S.board.type === "400" ? { rows: 30, mid: 15.5, len: 82.5, wid: 54.5 } : { rows: 63, mid: 32, len: 165, wid: 54.5 };
const railMissing = r => (((r - 3) % 6) + 6) % 6 === 5;

// CAD (x along rows, y across columns, z up) -> three (y up)
const V = (x, y, z) => new THREE.Vector3(x, z, -y);
const rowX = r => (r - BOARD.mid) * PITCH;
const RAD = Math.PI / 180;

// A second breadboard is named with a prefix, e.g. "pad:19e"; S.boards gives its offset in mm
const OFFSET = (S.boards ?? {});
function hole(label) {
  let pre = "", m0 = /^(\w+):(.*)$/.exec(label);
  if (m0 && OFFSET[m0[1]]) { pre = m0[1]; label = m0[2]; }
  const [dx, dy] = pre ? OFFSET[pre] : [0, 0];
  let m = /^(red|blue) rail @(\d+)$/.exec(label);
  if (m) return V(rowX(+m[2]) + dx, RAIL_Y[m[1]] + dy, 0);
  m = /^(\d+)([a-j])$/.exec(label);
  if (m) return V(rowX(+m[1]) + dx, COL_Y[m[2]] + dy, 0);
  return null;
}

// ---------------------------------------------------------------- renderer
const wrap = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
wrap.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.background = new THREE.Color(0xe9edf2);
scene.fog = new THREE.Fog(0xe9edf2, 900, 2200);

const camera = new THREE.PerspectiveCamera(38, 1, 1, 5000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.49;
controls.minDistance = 40;
controls.maxDistance = 1400;

scene.add(new THREE.HemisphereLight(0xffffff, 0xb9a88f, 0.55));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(-180, 420, 260);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -420, right: 420, top: 420, bottom: -420, near: 10, far: 1400 });
sun.shadow.bias = -0.0004;
sun.shadow.radius = 4;
scene.add(sun);

// Table
function woodTexture() {
  const c = document.createElement("canvas"); c.width = c.height = 1024;
  const g = c.getContext("2d");
  g.fillStyle = "#c9a57a"; g.fillRect(0, 0, 1024, 1024);
  for (let i = 0; i < 140; i++) {
    const y = Math.random() * 1024, a = 0.04 + Math.random() * 0.08;
    g.strokeStyle = `rgba(${90 + Math.random() * 40},${60 + Math.random() * 20},30,${a})`;
    g.lineWidth = 1 + Math.random() * 5;
    g.beginPath(); g.moveTo(0, y);
    for (let x = 0; x <= 1024; x += 64) g.lineTo(x, y + Math.sin(x / 140 + i) * 6);
    g.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(3, 3); t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const TABLE_Y = S.tableY ?? -8.5;
const table = new THREE.Mesh(new THREE.CircleGeometry(1400, 72),
  new THREE.MeshStandardMaterial({ map: woodTexture(), roughness: 0.75 }));
table.rotation.x = -Math.PI / 2; table.position.y = TABLE_Y; table.receiveShadow = true;
scene.add(table);

// ---------------------------------------------------------------- helpers
const MAT = {};
function mat(color, o = {}) {
  const key = color + JSON.stringify(o);
  if (!MAT[key]) MAT[key] = new THREE.MeshStandardMaterial({ color, roughness: 0.55, metalness: 0, ...o });
  return MAT[key];
}
const metal = () => mat(0xc9ccd2, { metalness: 0.9, roughness: 0.28 });
const gold = () => mat(0xd8b25a, { metalness: 0.9, roughness: 0.3 });
function mesh(geo, m, cast = true) { const o = new THREE.Mesh(geo, m); o.castShadow = cast; o.receiveShadow = true; return o; }
function box(w, h, d, m, r = 0) {
  const g = r > 0 ? new RoundedBoxGeometry(w, h, d, 3, r) : new THREE.BoxGeometry(w, h, d);
  return mesh(g, m);
}
function cyl(rt, rb, h, m, seg = 32) { return mesh(new THREE.CylinderGeometry(rt, rb, h, seg), m); }
function put(parent, o, x, y, z) { o.position.copy(V(x, y, z)); parent.add(o); return o; }
function canvasTex(w, h, draw) {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  draw(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}
// A flat printed label lying on a surface (CAD xy plane), facing up
function decal(w, h, tex, z = 0.02) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshStandardMaterial({ map: tex, transparent: true, roughness: 0.7 }));
  m.rotation.x = -Math.PI / 2; m.position.y = z; m.receiveShadow = true;
  return m;
}
function legs(parent, pts, top, m = metal(), r = 0.3) {
  // straight legs from each (x,y) point at z=-3 (inside the hole) up to z=top
  for (const [x, y, t] of pts) {
    const h = (t ?? top) + 3;
    put(parent, cyl(r, r, h, m, 8), x, y, -3 + h / 2);
  }
}

// ---------------------------------------------------------------- parts
const B = {};

B.breadboard = p => {
  const g = new THREE.Group();
  const { len, wid, rows } = BOARD;
  const pxmm = 10;
  const tex = canvasTex(Math.round(len * pxmm), Math.round(wid * pxmm), (c, w, h) => {
    c.fillStyle = "#f4f3ee"; c.fillRect(0, 0, w, h);
    const X = x => (x + len / 2) * pxmm, Y = y => (wid / 2 - y) * pxmm; // CAD y up -> canvas down
    c.fillStyle = "#e4e2da"; c.fillRect(0, Y(1.9), w, 3.8 * pxmm);
    for (const side of [1, -1]) {
      for (const [col, yy] of [["red", 21.59], ["blue", 19.05]]) {
        c.strokeStyle = col === "red" ? "#d9363e" : "#2f62d6"; c.lineWidth = 4;
        const ly = side * (yy + (col === "red" ? 1.6 : -1.6));
        c.beginPath(); c.moveTo(X(-len / 2 + 4), Y(ly)); c.lineTo(X(len / 2 - 4), Y(ly)); c.stroke();
        for (let r = 1; r <= rows; r++) if (!railMissing(r)) {
          c.fillStyle = "#3b3b3b"; c.fillRect(X(rowX(r)) - 7, Y(side * yy) - 7, 14, 14);
        }
      }
      c.fillStyle = "#d9363e"; c.font = "bold 26px sans-serif"; c.textAlign = "center"; c.textBaseline = "middle";
      c.fillText("+", X(-len / 2 + 2.2), Y(side * 21.59)); c.fillStyle = "#2f62d6";
      c.fillText("−", X(-len / 2 + 2.2), Y(side * 19.05));
    }
    for (let r = 1; r <= rows; r++) for (const [col, y] of Object.entries(COL_Y)) {
      c.fillStyle = "#3b3b3b"; c.fillRect(X(rowX(r)) - 7, Y(y) - 7, 14, 14);
    }
    c.fillStyle = "#777"; c.font = "17px sans-serif"; c.textAlign = "center"; c.textBaseline = "middle";
    for (let r = 1; r <= rows; r++) if (r === 1 || r % 5 === 0) {
      c.fillText(String(r), X(rowX(r)), Y(16.3)); c.fillText(String(r), X(rowX(r)), Y(-16.3));
    }
    for (const [col, y] of Object.entries(COL_Y)) {
      c.fillText(col, X(-len / 2 + 2.6), Y(y)); c.fillText(col, X(len / 2 - 2.6), Y(y));
    }
  });
  const body = box(len, 8.5, wid, mat(0xf2f1ec, { roughness: 0.8 }), 0.8);
  body.position.y = -4.25; g.add(body);
  g.add(decal(len, wid, tex, 0.01));
  g.traverse(o => { if (o.isMesh) o.castShadow = false; });
  body.receiveShadow = true;
  if (p.board) { const [dx, dy] = OFFSET[p.board]; g.position.copy(V(dx, dy, 0)); }
  return { group: g };
};

const ESP38_I = ["3V3", "EN", "SP", "SN", "G34", "G35", "G32", "G33", "G25", "G26", "G27", "G14", "G12", "GND", "G13", "SD2", "SD3", "CMD", "V5"];
const ESP38_A = ["GND", "G23", "G22", "TXD", "RXD", "G21", "GND", "G19", "G18", "G5", "G17", "G16", "G4", "G0", "G2", "G15", "SD1", "SD0", "CLK"];
const ESP30_I = ["EN", "VP", "VN", "D34", "D35", "D32", "D33", "D25", "D26", "D27", "D14", "D12", "D13", "GND", "VIN"];
const ESP30_B = ["D23", "D22", "TX0", "RX0", "D21", "D19", "D18", "D5", "TX2", "RX2", "D4", "D2", "D15", "GND", "3V3"];

function esp32(p, kind) {
  const g = new THREE.Group();
  const n = kind === 38 ? 19 : 15;
  const colI = "i", colO = kind === 38 ? "a" : "b";
  const r0 = p.rowStart ?? 2, r1 = r0 + n - 1;
  const xMid = (rowX(r0) + rowX(r1)) / 2, yMid = (COL_Y[colO] + COL_Y[colI]) / 2;
  const L = kind === 38 ? 55 : 51.5, W = 28.3;
  const pcbZ = 8.6; // header + spacer: pins go into the board
  const pins = { i: kind === 38 ? ESP38_I : ESP30_I, o: kind === 38 ? ESP38_A : ESP30_B };
  // black plastic header strips and pins
  for (const col of [colO, colI]) {
    put(g, box(n * PITCH, 2.5, 2.5, mat(0x161616)), xMid, COL_Y[col], 1.25 + 0.3);
    for (let r = r0; r <= r1; r++) put(g, box(0.64, pcbZ + 3, 0.64, gold()), rowX(r), COL_Y[col], (pcbZ - 3) / 2 + 0.01);
  }
  // PCB, antenna end at +x (row r1 side), USB at -x
  const pcb = put(g, box(L, 1.6, W, mat(0x16171b, { roughness: 0.45 }), 0.6), xMid + (L - n * PITCH) / 2 - 3.6, yMid, pcbZ + 0.8);
  const px = pcb.position.x, top = pcbZ + 1.6;
  // printed pin labels
  const lab = canvasTex(1100, 566, (c, w, h) => {
    c.fillStyle = "rgba(0,0,0,0)"; c.fillRect(0, 0, w, h);
    c.fillStyle = "#e8e8e8"; c.font = "bold 20px monospace"; c.textAlign = "center"; c.textBaseline = "middle";

const BANDS = { 1000: ["#8b4a1c", "#111", "#111", "#8b4a1c"], 10000: ["#8b4a1c", "#111", "#111", "#d32f2f"], 220: ["#d32f2f", "#d32f2f", "#111", "#111"] };
B.resistor = p => {
  const g = new THREE.Group();
  const a = hole(p.a), b = hole(p.b);
  const lift = 4.5;
  const A2 = a.clone().add(new THREE.Vector3(0, lift, 0)), B2 = b.clone().add(new THREE.Vector3(0, lift, 0));
  const path = new THREE.CurvePath();
  path.add(new THREE.LineCurve3(a.clone().add(new THREE.Vector3(0, -3, 0)), A2));
  path.add(new THREE.LineCurve3(A2, B2));
  path.add(new THREE.LineCurve3(B2, b.clone().add(new THREE.Vector3(0, -3, 0))));
  const pts = []; for (const c of path.curves) pts.push(c.v1, c.v2);
  for (let k = 0; k < pts.length; k += 2) {
    const len = pts[k].distanceTo(pts[k + 1]);
    const leg = cyl(0.3, 0.3, len, metal(), 8);
    leg.position.copy(pts[k]).lerp(pts[k + 1], 0.5);
    leg.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), pts[k + 1].clone().sub(pts[k]).normalize());
    g.add(leg);
  }
  const dir = B2.clone().sub(A2).normalize();
  const bodyLen = Math.min(6.3, A2.distanceTo(B2) - 1.2);
  const body = mesh(new THREE.CapsuleGeometry(1.2, bodyLen - 2.4, 6, 16), mat(0x5d8fd6, { roughness: 0.45 }));
  body.position.copy(A2).lerp(B2, 0.5); body.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir); g.add(body);
  const cols = BANDS[p.ohms] ?? BANDS[1000];
  [...cols, "#8b4a1c"].forEach((c, k) => {
    const band = cyl(1.25, 1.25, 0.55, mat(c), 20);
    const t = -0.36 + k * 0.15 + (k === 4 ? 0.1 : 0);
    band.position.copy(body.position).add(dir.clone().multiplyScalar(t * bodyLen));
    band.quaternion.copy(body.quaternion); g.add(band);
  });
  return { group: g };
};

// ---------------------------------------------------------------- build the scene from SPEC
const parts = {};
const anchorsWorld = {};
const root = new THREE.Group(); scene.add(root);

function addPart(p) {
  const b = (B[p.type])(p);
  b.spec = p;
  const g = b.group;
  if (p.pos) g.position.copy(V(...p.pos));
  if (p.rot) g.rotation.y = p.rot * RAD;
  if (p.tilt) { g.rotation.order = "YXZ"; g.rotation.x = p.tilt[0] * RAD; g.rotation.z = p.tilt[1] * RAD; }
  (p.fixed ? scene : root).add(g);
  g.traverse(o => { if (o.isMesh) { o.castShadow = o.castShadow !== false; } });
  parts[p.id] = b;
  return b;
}
function resolveAnchors() {
  root.updateMatrixWorld(true);
  for (const b of Object.values(parts)) {
    if (!b.anchors) continue;
    for (const [nm, a] of Object.entries(b.anchors)) {
      if (!a) continue;
      if (a.at) { anchorsWorld[nm] = { pos: hole(a.at), dir: new THREE.Vector3(0, 1, 0), board: true }; continue; }
      const obj = b.head ?? b.group;
      const pos = a.local ? a.pos.clone().applyMatrix4(obj.matrixWorld) : a.pos.clone();
      const dir = a.dir.clone().transformDirection(obj.matrixWorld);
      anchorsWorld[nm] = { ...a, pos, dir, owner: b };
    }
  }
}
const LATE = new Set(["usb"]);
for (const p of S.parts) if (!LATE.has(p.type)) addPart(p);
// parts that sit on other parts (e.g. sensor on the servo horn)
for (const p of S.parts) if (p.on) {
  const host = parts[p.on.part]; const target = p.on.node ? host[p.on.node] : host.group;
  target.add(parts[p.id].group);
  parts[p.id].group.position.copy(V(...(p.on.pos ?? [0, 0, 0])));
  parts[p.id].group.rotation.set(0, (p.on.rot ?? 0) * RAD, 0);
  if (p.on.flip) parts[p.id].group.rotateX(Math.PI);
}
resolveAnchors();
B.usb = p => {
  const g = new THREE.Group();
  const a = anchorsWorld[p.from ?? "USB"];
  const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), a.dir);
  const plug = mesh(new RoundedBoxGeometry(8.2, 3, 2.4, 2, 1), metal()); // the metal USB-C tip
  plug.position.copy(a.pos).add(a.dir.clone().multiplyScalar(-1)); plug.quaternion.copy(q); plug.rotateY(Math.PI / 2); g.add(plug);
  const over = mesh(new RoundedBoxGeometry(11, 16, 6.5, 3, 2.5), mat(0x202326)); over.position.copy(a.pos).add(a.dir.clone().multiplyScalar(9)); over.quaternion.copy(q); g.add(over);
  const s0 = a.pos.clone().add(a.dir.clone().multiplyScalar(17));
  const end = p.toAnchor ? anchorsWorld[p.toAnchor].pos : V(...p.to);
  const endDir = p.toAnchor ? anchorsWorld[p.toAnchor].dir : new THREE.Vector3(0, 0, 0);
  const pts = [s0, s0.clone().add(a.dir.clone().multiplyScalar(25)), ...(p.via ?? []).map(v => V(...v)), end.clone().add(endDir.clone().multiplyScalar(25)), end];
  g.add(mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts, false, "centripetal"), 120, 1.8, 12), mat(0x202326, { roughness: 0.6 })));
  if (p.toAnchor) { const o2 = mesh(new RoundedBoxGeometry(11, 16, 6.5, 3, 2.5), mat(0x202326)); o2.position.copy(end).add(endDir.clone().multiplyScalar(8)); o2.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), endDir); g.add(o2); }

};

const WIRE_HEX = { red: 0xd62828, black: 0x1b1b1b, yellow: 0xf2c200, green: 0x1f9d48, orange: 0xf07c12, blue: 0x2459d6, white: 0xf2f2f2,
  purple: 0x8a3fd1, pink: 0xf06292, teal: 0x14a3a3, grey: 0x8a8f99, brown: 0x6b3a1e };
function endInfo(e) {
  const h = hole(e);
  if (h) return { pos: h, dir: new THREE.Vector3(0, 1, 0), kind: "male" };

    if (d < P.far && (solid || t >= this.next)) {
      const gap = solid ? 0.09 : 0.08 + (Math.min(d, P.far) - P.solid) / (P.far - P.solid) * 0.62;
      this.next = t + gap; beep(2600, solid ? 0.1 : 0.06, "square", 0.04); ring(parts.buzzer.waves, d < P.close ? 0xff3b3b : 0xff9f1a);
    }
    if (d < P.far && (t - (this.sayT ?? -9)) > 0.5) { this.sayT = t; say(solid ? "Solid tone" : `${Math.round(d)} cm`, tg.group.position.clone().add(new THREE.Vector3(0, 120, 0))); }
    tickRings(parts.buzzer.waves, dt);
  },
};

// Game Controller: joystick tilts, buttons press, the runner on the laptop reacts
DEMOS.controller = {
  reset() { this.i = -1; this.next = 0.8; this.lane = 0; this.laneNow = 0; this.jump = -9; this.roll = -9; this.key = ""; },
  tick(dt, t) {
    const js = parts.joystick, lp = parts.laptop; if (!js || !lp) return;
    const seq = [["left", "←"], ["right", "→"], ["right", "→"], ["space", "Space"], ["left", "←"], ["down", "↓"], ["left", "←"], ["space", "Space"], ["right", "→"]];
    if (t >= this.next) {
      this.i = (this.i + 1) % seq.length; this.next = t + 1.25;
      const [a, label] = seq[this.i]; this.act = a; this.actT = t; this.key = label;
      if (a === "left") this.lane = Math.max(-1, this.lane - 1);
      if (a === "right") this.lane = Math.min(1, this.lane + 1);
      if (a === "space") this.jump = t;
      if (a === "down") this.roll = t;
      beep(a === "space" ? 880 : 520, 0.05, "square", 0.03);
    }
    const held = t - this.actT < 0.45;
    const tilt = held ? 0.38 : 0;
    js.stick.rotation.z = this.act === "left" ? tilt : this.act === "right" ? -tilt : 0;
    js.stick.rotation.x = this.act === "down" ? tilt : 0;
    parts.btn1?.press(held && this.act === "space");
    this.laneNow += (this.lane - this.laneNow) * Math.min(1, dt * 9);
    const c = lp.screenC.getContext("2d"), W = 640, H = 400;
    const sky = c.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, "#7cc6ff"); sky.addColorStop(1, "#d7f0ff");
    c.fillStyle = sky; c.fillRect(0, 0, W, H);
    const hz = 120, X = (lane, y) => W / 2 + lane * (60 + (y - hz) * 0.9);
    c.fillStyle = "#5b6470"; c.beginPath(); c.moveTo(W / 2 - 40, hz); c.lineTo(W / 2 + 40, hz); c.lineTo(W + 120, H); c.lineTo(-120, H); c.fill();
    c.strokeStyle = "#e8e2c8"; c.lineWidth = 4;
    for (const l of [-0.5, 0.5]) { c.beginPath(); c.moveTo(X(l, hz), hz); c.lineTo(X(l, H), H); c.stroke(); }
    for (let k = 0; k < 6; k++) { // sleepers moving towards you
      const y = hz + ((k / 6 + t * 0.6) % 1) ** 2 * (H - hz);
      c.fillStyle = "rgba(0,0,0,.18)"; c.fillRect(X(-1.5, y), y, X(1.5, y) - X(-1.5, y), 3 + (y - hz) * 0.03);
    }
    const ob = (lane, ph, col) => { const q = ((t * 0.35 + ph) % 1) ** 2, y = hz + q * (H - hz), s = 10 + q * 90; c.fillStyle = col; c.fillRect(X(lane, y) - s / 2, y - s, s, s); };
    ob(-1, 0.1, "#e9a23b"); ob(1, 0.55, "#d64545"); ob(0, 0.8, "#3f9b5a");
    const jy = Math.max(0, Math.sin(Math.min(1, (t - this.jump) / 0.6) * Math.PI)) * 70;
    const rolling = t - this.roll < 0.6;
    const rx_ = X(this.laneNow, H - 40), ry = H - 40 - jy;
    c.fillStyle = "rgba(0,0,0,.25)"; c.beginPath(); c.ellipse(rx_, H - 30, 26, 8, 0, 0, 7); c.fill();
    c.fillStyle = "#2f6fe4"; c.fillRect(rx_ - 16, ry - (rolling ? 40 : 70), 32, rolling ? 30 : 50);
    c.fillStyle = "#f1c27d"; c.beginPath(); c.arc(rx_, ry - (rolling ? 50 : 84), 14, 0, 7); c.fill();
    c.fillStyle = "rgba(10,16,24,.75)"; c.fillRect(0, 0, W, 44);
    c.fillStyle = "#fff"; c.font = "bold 22px sans-serif"; c.textAlign = "left"; c.fillText("🎮 Robotics Club Controller 1 · connected", 14, 30);
    if (held) { c.textAlign = "right"; c.fillStyle = "#ffd21f"; c.fillText(`key: ${this.key}`, W - 14, 30); }
    lp.screenT.needsUpdate = true;
  },
};

// ---------------------------------------------------------------- UI
const dots = document.getElementById("dots");
steps.forEach((s, k) => { const b = document.createElement("button"); b.title = s.title; b.onclick = () => { goTo(k); }; dots.appendChild(b); });
document.getElementById("prev").onclick = () => goTo(cur - 1);
document.getElementById("next").onclick = () => goTo(cur + 1);
const playBtn = document.getElementById("play");
function setPlaying(v) { playing = v; playBtn.textContent = v ? "❚❚" : "▶"; playBtn.title = v ? "Pause" : "Play"; }
playBtn.onclick = () => setPlaying(!playing);
document.getElementById("sound").onclick = e => { audio.on = !audio.on; e.currentTarget.textContent = audio.on ? "🔊" : "🔇"; if (audio.on) { audio.ctx ??= new (window.AudioContext || window.webkitAudioContext)(); audio.ctx.resume(); } };
renderer.domElement.addEventListener("pointerdown", () => { camT = 1; });
window.addEventListener("keydown", e => { if (e.key === "ArrowRight") goTo(cur + 1); if (e.key === "ArrowLeft") goTo(cur - 1); if (e.key === " ") { e.preventDefault(); setPlaying(!playing); } });

function resize() {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  renderer.setSize(w, h); camera.aspect = w / h;
  const panelH = document.getElementById("panel").offsetHeight + 20;
  camera.setViewOffset(w, h, 0, Math.round(panelH * 0.42), w, h);
  camera.updateProjectionMatrix();
}
window.addEventListener("resize", resize); resize();

// start
camera.position.set(-260, 260, 360); controls.target.set(0, 0, 0);
const params = new URLSearchParams(location.hash.slice(1));
goTo(+(params.get("step") ?? 0), params.has("instant"));
if (params.has("clean")) document.body.classList.add("clean");
if (params.has("pause") || window.matchMedia("(prefers-reduced-motion: reduce)").matches) setPlaying(false);
new ResizeObserver(resize).observe(document.getElementById("panel"));

const clock = new THREE.Clock();
let orbitA = 0;
function frame() {
  const dt = Math.min(0.05, clock.getDelta());
  stepT += dt;
  runAnims(dt);
  if (camT < 1) {
    camT = Math.min(1, camT + dt / 1.6); const k = ease(camT);
    camera.position.lerpVectors(camFrom.pos, camTo.pos, k); controls.target.lerpVectors(camFrom.tgt, camTo.tgt, k);
  } else if (steps[cur].all && playing) {
    orbitA += dt * 0.12; const off = camera.position.clone().sub(controls.target);
    off.applyAxisAngle(new THREE.Vector3(0, 1, 0), dt * 0.12); camera.position.copy(controls.target).add(off);
  }
  const s = steps[cur];
  if (s.demo) { demoState.t += dt; DEMOS[S.demo]?.tick(dt, demoState.t); } else { beam.visible = false; const ins = document.getElementById("inset"); if (ins) ins.hidden = true; }
  // autoplay
  const words = (s.text || "").replace(/<[^>]+>/g, "").split(/\s+/).length;
  const hold = s.hold ?? (s.demo ? 16 : Math.max(5.5, 2.4 + words * 0.32 + (s.show?.length ?? 0) * 0.45));
  if (playing && stepT > hold && cur < steps.length - 1) goTo(cur + 1);
  controls.update();
  updateTags();
  renderer.render(scene, camera);
  window.__ready = true;
  requestAnimationFrame(frame);
}
frame();

</script>
